version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: keystone-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
