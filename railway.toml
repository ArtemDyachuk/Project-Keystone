# Railway Config as Code

# Backend (NestJS) - shared monorepo pattern
[[services]]
name = "cms-api"
root = "."
[services.build]
buildCommand = "npm ci && npx nx build @keystone/cms-api"
startCommand = "node apps/back-ends/cms-api/dist/main.js"

# Frontend (Next.js) - shared monorepo pattern  
[[services]]
name = "cms"
root = "."
[services.build]
buildCommand = "npm ci && npx nx build @keystone/cms"
startCommand = "cd apps/front-ends/cms && npx next start -p $PORT"


