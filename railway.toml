# Railway Config as Code for monorepo

# Backend service (NestJS)
[[services]]
name = "cms-api"
root = "."
buildCommand = "npx nx run @keystone/cms-api:build:production"
startCommand = "node apps/back-ends/cms-api/dist/main.js"

# Frontend service (Next.js)
[[services]]
name = "cms-web"
root = "."
buildCommand = "npx nx run @keystone/cms:build"
startCommand = "npx nx run @keystone/cms:start -- -p $PORT"


