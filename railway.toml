# Railway Config as Code
# Project Keystone NX Monorepo Configuration
# 
# This configuration handles both services in the monorepo

# Frontend Service Configuration
[build]
builder = "nixpacks"
buildCommand = "npx nx build @keystone/cms"

[deploy]
startCommand = "cd apps/front-ends/cms && npx next start -p $PORT"
restartPolicyType = "on_failure"
healthcheckPath = "/"
healthcheckTimeout = 300

# Backend Service Configuration
[[services]]
name = "cms-api"
buildCommand = "npx nx build @keystone/cms-api"
startCommand = "cd apps/back-ends/cms-api && node dist/main.js"
installCommand = "npm install"
healthcheckPath = "/api/health"
healthcheckTimeout = 300

# Environment Variables Required for Production:
# MONGODB_URI - MongoDB Atlas connection string (set in Railway dashboard)
# NODE_ENV - "production" (auto-set by Railway)
# PORT - "8080" (auto-set by Railway)
