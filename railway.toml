# Railway Config as Code

# Backend (NestJS) - shared monorepo pattern
[[services]]
name = "cms-api"
root = "."
install = "npm ci"
build = "npx nx build @keystone/cms-api"
start = "node apps/back-ends/cms-api/dist/main.js"

# Frontend (Next.js) - shared monorepo pattern  
[[services]]
name = "cms"
root = "."
install = "npm ci"
build = "npx nx build @keystone/cms"
start = "cd apps/front-ends/cms && npx next start -p $PORT"


