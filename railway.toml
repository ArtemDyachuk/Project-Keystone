# Railway Config as Code

# Backend (NestJS) - shared monorepo pattern (run from repo root)
[[services]]
name = "cms-api"
root = "."
build = "npx nx run @keystone/cms-api:build:production"
start = "node apps/back-ends/cms-api/dist/main.js"

# Frontend (Next.js) - isolated pattern (run in app directory)
[[services]]
name = "cms"
root = "apps/front-ends/cms"
build = "npx next build"
start = "npx next start -p $PORT"


